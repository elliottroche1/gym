<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Gym</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">

<style>
:root{--bg:#fff;--ink:#111;--ink2:#6b7280;--ink3:#9aa0a6;--line:#e5e7eb;--line2:#f1f3f5;--soft:#f8f9fa;--chip:#f1f3f5;--blue:#0b57d0;--blue-soft:#e8f0fe;--amber:#b45309;--amber-soft:#fef3c7;--green:#047857;--red:#b91c1c;--dark:#111;--dark2:#2a2a2a;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:var(--sat)}
main{max-width:560px;margin:0 auto;padding:10px 0 calc(72px + var(--sab));min-height:100vh}
.pad{padding:0 16px}
.hdr{display:flex;align-items:center;gap:10px;padding:6px 16px 0}
.hdr h1{font-size:22px;font-weight:700;margin:0}
.hdr .back{color:var(--blue);font-size:15px;background:none;border:0;padding:8px 8px 8px 0;min-height:40px}
.hdr .right{margin-left:auto;font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.gear{width:32px;height:32px;border-radius:50%;background:var(--chip);border:0;color:var(--ink2);font-size:15px;display:flex;align-items:center;justify-content:center;padding:0;min-height:0}
button{font:inherit;color:inherit;background:var(--chip);border:0;border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
button:active{filter:brightness(.92)}
button.primary{background:var(--blue);color:#fff;font-weight:700}
button.ghost{background:transparent;color:var(--blue);padding:8px}
button.sm{min-height:36px;padding:6px 10px;font-size:13px;border-radius:8px}
button:disabled{opacity:.45}
input,select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
input[type=number]{-moz-appearance:textfield}
label.f{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px}
.today{margin:14px 16px 0;background:var(--dark);color:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.today .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase}
.today .plan{font-size:15px;line-height:1.5}
.today .plan span{color:var(--ink3)}
.today .btns{display:flex;gap:8px}
.today .btns button{color:#fff;background:transparent;border:1px solid #3a3a3a;font-size:14px;padding:0 14px}
.today .btns button.primary{flex:1;background:var(--blue);border:0}
.sec{margin-top:18px;padding:0 16px 6px;font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.row{display:grid;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2);font-size:14px;align-items:center}
.row.tap{cursor:pointer}
.row .d{font-weight:600}.row .dd{font-size:11px}
.row .sub{font-size:12px;color:var(--ink2)}
.row .chev{color:var(--ink3)}
.pr{font-size:11px;background:var(--amber-soft);color:#92400e;padding:1px 6px;border-radius:4px;font-weight:600;vertical-align:middle}
.day-push{color:var(--blue)}.day-legs{color:var(--amber)}.day-pull{color:var(--green)}.day-other{color:var(--ink2)}
.thead{display:grid;gap:6px;padding:6px 16px;font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);margin-top:14px}
.exrow{display:grid;gap:6px;padding:10px 16px;align-items:center;border-bottom:1px solid var(--line2);font-size:14px}
.exrow .name{font-weight:600;line-height:1.2}
.exrow .name .late{color:var(--amber);font-size:11px;font-weight:500;margin-left:4px}
.exrow .sub{font-size:11px;color:var(--ink2);margin-top:2px}
.cell{height:40px;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:13px;border:0;padding:0;min-height:0;width:100%;font-weight:600}
.cell.done{background:var(--blue-soft);color:var(--blue)}
.cell.next{border:1.5px solid var(--blue);color:var(--blue);background:#fff}
.cell.sel{outline:2px solid var(--dark);outline-offset:-2px}
.cell.pr{background:var(--amber-soft);color:#92400e}
.cell input,.cell select{height:40px;min-height:0;padding:0 6px;text-align:center;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--ink)}
.cell.filled{color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(12px + var(--sab));z-index:5;pointer-events:none}
.bar .in{max-width:528px;margin:0 auto;background:var(--dark);color:#fff;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;pointer-events:auto;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.bar .top{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);gap:10px}
.bar .big{display:flex;align-items:baseline;gap:6px;font-size:30px;font-weight:700;line-height:1}
.bar .big .u{font-size:13px;color:var(--ink3);font-weight:400}
.bar .big .x{color:#666;font-weight:400;margin:0 4px}
.bar .big input{width:72px;background:transparent;border:0;color:#fff;font-size:30px;font-weight:700;padding:0;min-height:0;text-align:center;border-bottom:1px solid #444;border-radius:0}
.bar .keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.bar .keys button{height:44px;min-height:0;border-radius:8px;background:var(--dark2);color:#fff;font-size:15px;font-weight:600;padding:0}
.bar .keys button.save{background:var(--blue);grid-column:span 2;font-weight:700}
.bar .keys button.del{background:#3a1d1d;color:#ffb4b4}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;padding-bottom:var(--sab);z-index:4}
nav button{flex:1;background:transparent;border-radius:0;min-height:52px;color:var(--ink2);font-size:12px;font-weight:500}
nav button.on{color:var(--blue);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:14px 16px 0}
.tile{background:var(--soft);border-radius:10px;padding:10px 12px}
.tile .l{font-size:11px;color:var(--ink2)}.tile .v{font-size:18px;font-weight:700;margin-top:2px}
.note{margin:12px 16px 0;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:13px;line-height:1.5}
.note.good{background:#ecfdf5;color:#065f46}.note.warn{background:var(--amber-soft);color:#92400e}
.banner{margin:8px 16px;background:var(--amber-soft);color:#92400e;padding:10px 14px;border-radius:10px;font-size:13px}
svg.chart{width:100%;height:150px;display:block}
.card{margin:10px 16px 0;border:1px solid var(--line);border-radius:12px;padding:14px}
.muted{color:var(--ink2)}.small{font-size:13px}.tiny{font-size:12px;color:var(--ink3)}
.hidden{display:none !important}
.auth{max-width:380px;margin:60px auto;padding:0 16px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}.toggle input{width:20px;height:20px;min-height:0;margin:0}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.rowbtn{display:flex;gap:8px;margin-top:12px}
</style>
</head>
<body>
<main id="app"><p class="muted" style="padding:40px 16px;text-align:center">Loading…</p></main>
<div id="bar" class="bar hidden"></div>
<nav id="nav" class="hidden"><button data-tab="log">Log</button><button data-tab="lifts">Lifts</button></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="seed.js"></script>
<script>
/* ======================= CONFIG ======================= */
const SUPABASE_URL = "https://xicbnfvgucmjwlhactlt.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpY2JuZnZndWNtandsaGFjdGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE0OTY2NjAsImV4cCI6MjA3NzA3MjY2MH0.g03X6Cs883C0xl2oozs4-TlzyFEShcp2LjtNGe5JKNg";
const REQUIRE_LOGIN = true;
/* ====================================================== */

const MOCK = new URLSearchParams(location.search).get('mock') === '1';
const DAYS = {push:'Push', legs:'Legs', pull:'Pull', other:'Other'};
const MACHINES = ['Treadmill','Bike','Stepper','Rower','Other'];
const TEST_EVERY_DAYS = 56;
const BW_TARGET = 70;
const DEFAULT_BW = 68;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad2 = n => String(n).padStart(2,'0');
const dstr = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayStr = () => dstr(new Date());
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00') - new Date(a+'T00:00'))/86400000);
const fmtDate = s => new Date(s+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const fmtDateLong = s => new Date(s+'T00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const ago = s => { if(!s) return 'never'; const n=daysBetween(s,todayStr()); return n===0?'today':n===1?'1 day':`${n} days`; };
const agoShort = s => { if(!s) return '—'; const n=daysBetween(s,todayStr()); return n===0?'today':`${n}d`; };
const num = x => (Math.round(x*10)/10).toString();
const fmtW = (ex,w) => ex.kind==='bodyweight' ? (+w>0?`BW+${num(w)}kg`:'BW') : `${num(w)}kg`;
const fmtSet = (ex,s) => `${fmtW(ex,s.weight)}×${s.reps}`;
const fmtSets = (ex,sets) => sets.map(s=>fmtSet(ex,s)).join(' · ');

/* ---------------- data layer ---------------- */
let DB;
function makeSupabaseDB(url,key){
  const sb = supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true}});
  const q = async p => { const {data,error} = await p; if(error) throw error; return data; };
  const T = t => 'gym_'+t;
  return {
    kind:'supabase',
    async session(){ if(!REQUIRE_LOGIN) return {user:{email:'no login'}}; return (await sb.auth.getSession()).data.session; },
    async signIn(email,password){ return q(sb.auth.signInWithPassword({email,password})); },
    async signUp(email,password){ return q(sb.auth.signUp({email,password})); },
    async signOut(){ await sb.auth.signOut(); },
    async loadAll(){
      const [exercises,sets,cardio,bodyweight] = await Promise.all([
        q(sb.from(T('exercises')).select('*').order('sort_order')),
        q(sb.from(T('sets')).select('*').order('done_on').order('created_at')),
        q(sb.from(T('cardio')).select('*').order('done_on')),
        q(sb.from(T('bodyweight')).select('*').order('measured_on')),
      ]);
      return {exercises,sets,cardio,bodyweight};
    },
    insert:(t,row)=>q(sb.from(T(t)).insert(row).select().single()),
    insertMany:(t,rows)=>q(sb.from(T(t)).insert(rows).select()),
    update:(t,id,patch)=>q(sb.from(T(t)).update(patch).eq('id',id).select().single()),
    remove:(t,id)=>q(sb.from(T(t)).delete().eq('id',id)),
  };
}
function makeMockDB(){
  const store = {exercises:[],sets:[],cardio:[],bodyweight:[]};
  let n=0; const id=()=>'m'+(++n);
  const sleep = ()=>new Promise(r=>setTimeout(r,3));
  return {
    kind:'mock',
    async session(){ return {user:{email:'mock@example.com'}}; },
    async signIn(){}, async signUp(){}, async signOut(){},
    async loadAll(){ await sleep(); return JSON.parse(JSON.stringify(store)); },
    async insert(t,row){ await sleep(); const r={id:id(),created_at:new Date().toISOString(),...row}; store[t].push(r); return {...r}; },
    async insertMany(t,rows){ const out=[]; for(const r of rows) out.push(await this.insert(t,r)); return out; },
    async update(t,i,patch){ await sleep(); const r=store[t].find(x=>x.id===i); Object.assign(r,patch); return {...r}; },
    async remove(t,i){ await sleep(); store[t]=store[t].filter(x=>x.id!==i); },
  };
}

/* ---------------- state ---------------- */
const S = { view:'log', tab:'log', date:null, dayKey:null, extra:new Set(), liftId:null, sel:null, ex:[], sets:[], cardio:[], bw:[], user:null, busy:false, err:null, showExtras:false, editEx:undefined };

const exById = id => S.ex.find(e=>e.id===id);
const setsOf = ex => S.sets.filter(s=>s.exercise_id===ex.id);
const sessionsOf = ex => {
  const m = new Map();
  for(const s of setsOf(ex)){ if(!m.has(s.done_on)) m.set(s.done_on,[]); m.get(s.done_on).push(s); }
  return [...m.entries()].sort((a,b)=>a[0]<b[0]?-1:1).map(([date,sets])=>({date,sets}));
};
const lastDate = ex => { const d=setsOf(ex).map(s=>s.done_on); return d.length?d.reduce((a,b)=>a>b?a:b):null; };
const bwAt = date => { const b=S.bw.filter(x=>x.measured_on<=date); return b.length?+b[b.length-1].kg:(S.bw.length?+S.bw[0].kg:DEFAULT_BW); };

/* ---------------- strength maths ---------------- */
// Epley estimated 1RM. For bodyweight lifts it's the estimated max *added* weight at 1 rep, using bodyweight on that date.
function est1(ex, w, r, date){
  w=+w; r=+r; if(r<=0) return 0;
  if(ex.kind==='bodyweight'){ const bw=bwAt(date||todayStr()); const tot=(bw+w)*(r===1?1:(1+r/30)); return tot-bw; }
  if(ex.kind==='swing') return w*r; // volume for swings
  return r===1? w : w*(1+r/30);
}
const fmtEst = (ex,v) => ex.kind==='bodyweight' ? (v>0?`BW+${Math.round(v)}kg`:'BW') : ex.kind==='swing' ? `${Math.round(v)}` : `${Math.round(v)}kg`;
function bestSet(ex, before){ // best set by est1 among sets before (exclusive) date `before` (or all)
  let best=null, bv=-1;
  for(const s of setsOf(ex)){ if(before && s.done_on>=before) continue; const v=est1(ex,s.weight,s.reps,s.done_on); if(v>bv){bv=v;best=s;} }
  return best;
}
function isPR(ex, s){ // was this set a record at the time it was logged (strictly beats everything on earlier dates)?
  const v=est1(ex,s.weight,s.reps,s.done_on); if(v<=0) return false;
  for(const o of setsOf(ex)){ if(o.done_on<s.done_on && est1(ex,o.weight,o.reps,o.done_on)>=v) return false; }
  // also must beat earlier sets the same day
  for(const o of setsOf(ex)){ if(o.done_on===s.done_on && o.id!==s.id && (o.created_at||'')<(s.created_at||'') && est1(ex,o.weight,o.reps,o.done_on)>=v) return false; }
  return setsOf(ex).some(o=>o.done_on<s.done_on); // no PR badge on the very first session
}

/* ---------------- progression ---------------- */
const atWW = (ex,s) => Math.abs(+s.weight-(+ex.working_weight))<0.01;
function sessionHit(ex,sess){ const ok=sess.sets.filter(s=>+s.weight>=+ex.working_weight-0.01 && s.reps>=ex.target_reps+(ex.kind==='swing'?5:0)); return ok.length>=ex.target_sets; }
function sessionFail(ex,sess){ if(ex.kind==='swing') return false; return sess.sets.some(s=>atWW(ex,s) && s.reps<=Math.max(1,ex.target_reps-2)); }
function evaluate(ex, sessions){
  const since = sessions.filter(s=>s.date>ex.ww_updated_on);
  if(!since.length) return null;
  const last=since[since.length-1], prev=since[since.length-2], inc=+ex.increment;
  if(sessionFail(ex,last)) return {next:Math.max(0,+ex.working_weight-inc), on:last.date, reason:'drop'};
  if(ex.kind==='swing'){ return sessionHit(ex,last)?{next:+ex.working_weight+inc,on:last.date,reason:'up'}:null; }
  if(prev && sessionHit(ex,last) && sessionHit(ex,prev)) return {next:+ex.working_weight+inc, on:last.date, reason:'up'};
  return null;
}
async function applyProgression(){
  const t=todayStr();
  for(const ex of S.ex){
    if(ex.archived) continue;
    const r=evaluate(ex, sessionsOf(ex).filter(s=>s.date<t));
    if(r && (r.next!==+ex.working_weight || r.on!==ex.ww_updated_on)){ Object.assign(ex, await DB.update('exercises',ex.id,{working_weight:r.next, ww_updated_on:r.on})); }
  }
}
function warmup(ex){
  const ww=+ex.working_weight; const out=[];
  if(ex.kind==='weight'){
    if(ww>=40 && +ex.increment>=5) out.push('bar ×5');
    const w75 = +ex.increment>=5 ? Math.round(ww*0.75/5)*5 : Math.round(ww*0.75/2.5)*2.5;
    if(w75>0 && w75<ww) out.push(`${num(w75)}kg ×3`);
  } else if(ex.kind==='bodyweight'){ out.push(ww>0?'BW ×3':'2–3 easy reps'); }
  return out.join(', ');
}
function targetStr(ex){ return ex.kind==='swing' ? `${num(ex.working_weight)}kg × ${ex.target_reps}` : `${fmtW(ex,ex.working_weight)} × ${ex.target_reps}`; }
function statusNote(ex){ // for today's session / lift page
  const t=todayStr(); const sessions=sessionsOf(ex); const todayS=sessions.find(s=>s.date===t);
  const before=sessions.filter(s=>s.date<t).filter(s=>s.date>ex.ww_updated_on); const last=before[before.length-1];
  if(todayS){
    const r=evaluate(ex,sessions);
    if(r?.reason==='up') return {cls:'good',text:`Done — next time ${fmtW(ex,r.next)}.`};
    if(r?.reason==='drop') return {cls:'warn',text:`Tough one. Next time drops to ${fmtW(ex,r.next)}.`};
    if(sessionHit(ex,todayS)) return {cls:'good',text: ex.kind==='swing'?'Target hit.':(last&&sessionHit(ex,last)?'Target hit.':'Target hit — once more next session and the weight goes up.')};
    return null;
  }
  if(ex.kind!=='swing' && last && sessionHit(ex,last)) return {cls:'good',text:`Hit ${ex.target_reps}s across the board last time. Do it again and next session goes up ${num(ex.increment)}kg.`};
  return null;
}
// Projection: when does 3×target at the working weight beat the all-time best (by est1)?
function projection(ex){
  if(ex.kind==='swing' || ex.archived) return null;
  const t=todayStr(); const best=bestSet(ex); if(!best) return null;
  const bestV=est1(ex,best.weight,best.reps,best.done_on);
  const inc=+ex.increment||2.5; let ww=+ex.working_weight, k=0;
  while(est1(ex,ww,ex.target_reps,t)<=bestV && k<60){ ww+=inc; k++; }
  // frequency: sessions of this lift in the last 8 weeks
  const since=dstr(new Date(Date.now()-56*86400000));
  const n=sessionsOf(ex).filter(s=>s.date>=since && s.date<t).length;
  const freq=Math.max(n/8, 0.25);
  const sessionsNeeded=k*2; // two hits per step
  const weeks=sessionsNeeded/freq, weeks2=sessionsNeeded/2;
  const when=w=>fmtDate(dstr(new Date(Date.now()+w*7*86400000)));
  return {k, ww, bestV, best, freq, weeks, weeks2, date:when(weeks), date2:when(weeks2), sessionsNeeded};
}

/* ---------------- day logic ---------------- */
const coreOf = d => S.ex.filter(e=>!e.archived && e.core && e.day===d);
function dayInfo(){ return ['push','legs','pull'].map(d=>{ const dates=coreOf(d).map(lastDate).filter(Boolean); const last=dates.length?dates.reduce((a,b)=>a>b?a:b):null; return {d,last,days:last?daysBetween(last,todayStr()):999}; }); }
const suggestedDay = () => dayInfo().sort((a,b)=>b.days-a.days)[0].d;
function dayOfDate(date){ // majority day among exercises logged that date
  const c={}; for(const s of S.sets.filter(s=>s.done_on===date)){ const e=exById(s.exercise_id); if(e) c[e.day]=(c[e.day]||0)+1; }
  const k=Object.keys(c).sort((a,b)=>c[b]-c[a])[0]; return k||null;
}
function sessionDates(){ const d=new Set([...S.sets.map(s=>s.done_on), ...S.cardio.map(c=>c.done_on)]); return [...d].sort().reverse(); }

/* ---------------- rendering ---------------- */
function render(){
  const app=$('#app'); $('#nav').classList.remove('hidden');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const v={log:renderLog, session:renderSession, lifts:renderLifts, lift:renderLift, body:renderBody, settings:renderSettings}[S.view];
  app.innerHTML=(S.err?`<div class="banner">${esc(S.err)}</div>`:'')+v();
  renderBar();
  bind();
}
function renderLog(){
  const t=todayStr(); const sug=suggestedDay(); const info=dayInfo();
  const todaySets=S.sets.filter(s=>s.done_on===t);
  const lastBw=S.bw[S.bw.length-1];
  let card;
  if(todaySets.length){
    const dk=dayOfDate(t)||sug;
    card=`<div class="today"><div class="meta"><span>Today · ${fmtDateLong(t)}</span><span>${DAYS[dk]} · ${todaySets.length} set${todaySets.length>1?'s':''}</span></div>
      <div class="plan">${summaryOf(t)}</div>
      <div class="btns"><button class="primary" data-act="open" data-date="${t}" data-day="${dk}">Continue</button></div></div>`;
  } else {
    const plan=coreOf(sug).map(e=>`${esc(e.name)} <span>${targetStr(e)}</span>`).join(' · ');
    const others=info.filter(i=>i.d!==sug);
    card=`<div class="today"><div class="meta"><span>Today · ${fmtDateLong(t)}</span><span>${DAYS[sug]} · ${ago(info.find(i=>i.d===sug).last)}</span></div>

      <div class="btns"><button class="primary" data-act="open" data-date="${t}" data-day="${sug}">Start ${DAYS[sug]}</button>${others.map(o=>`<button data-act="open" data-date="${t}" data-day="${o.d}">${DAYS[o.d]}</button>`).join('')}</div></div>`;
  }
  const dates=sessionDates().filter(d=>d!==t);
  const rows=dates.slice(0,60).map(d=>{ const dk=dayOfDate(d); const c=S.cardio.find(x=>x.done_on===d);
    return `<div class="row tap" style="grid-template-columns:72px 1fr auto" data-act="open" data-date="${d}" data-day="${dk||''}"><div><div class="d">${fmtDate(d)}</div><div class="dd day-${dk||'other'}">${dk?DAYS[dk]:'Cardio'}</div></div><div style="line-height:1.5">${summaryOf(d)}${c?`<div class="sub">${esc(c.machine||'cardio')}${c.minutes?' '+num(c.minutes)+' min':''}${c.calories?' · '+c.calories+' kcal':''}</div>`:''}</div><div class="chev">›</div></div>`; }).join('');
  return `<div class="hdr"><h1>Log</h1><div class="right">${lastBw?`${num(lastBw.kg)} kg · ${fmtDate(lastBw.measured_on)}`:''}<button class="gear" data-act="settings" aria-label="Settings">⚙</button></div></div>
    ${card}
    <div class="sec"><span>Past sessions</span><span>${dates.length}</span></div>
    ${rows||'<p class="muted small pad" style="margin-top:12px">Nothing logged yet. Import your history in Settings, or start a session.</p>'}`;
}
function summaryOf(date){
  const by=new Map();
  for(const s of S.sets.filter(s=>s.done_on===date)){ if(!by.has(s.exercise_id)) by.set(s.exercise_id,[]); by.get(s.exercise_id).push(s); }
  return [...by.entries()].map(([id,sets])=>{ const ex=exById(id); if(!ex) return ''; const pr=sets.some(s=>isPR(ex,s)); return `${esc(shortName(ex))} ${fmtSets(ex,sets)}${pr?' <span class="pr">PR</span>':''}`; }).join('<br>') || '<span class="muted">cardio only</span>';
}
const shortName = ex => ex.name.replace('Barbell squat','Squat').replace('Bench press','Bench').replace('Military press','Press').replace('grip pull-ups','pull-ups');

function chart(pts,{ref=null,decimals=0,proj=null,fmt=null}={}){
  const W=358,H=150,px=34,py=16; const data=pts.filter(p=>p.v!=null && isFinite(p.v));
  if(!data.length) return '<p class="muted small">No data yet.</p>';
  const ms=s=>new Date(s+'T00:00').getTime();
  let x0=ms(data[0].date), x1=ms(data[data.length-1].date);
  const projPt = proj ? {t:Date.now()+proj.weeks*7*86400000, v:proj.v} : null;
  if(projPt) x1=Math.max(x1,projPt.t);
  if(x0===x1){x0-=7*86400000;x1+=7*86400000;}
  const ys=data.map(p=>p.v).concat(ref!=null?[ref]:[], projPt?[projPt.v]:[]);
  let y0=Math.min(...ys), y1=Math.max(...ys); const pad=Math.max((y1-y0)*0.15, decimals?0.5:2); y0-=pad; y1+=pad;
  const X=t=>px+(t-x0)/(x1-x0)*(W-px-10), Y=v=>H-py-(v-y0)/(y1-y0)*(H-2*py);
  const f=v=>fmt?fmt(v):v.toFixed(decimals);
  const line=data.map((p,i)=>`${i?'L':'M'}${X(ms(p.date)).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const dots=data.map(p=>`<circle cx="${X(ms(p.date)).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.5" fill="var(--blue)"/>`).join('');
  const last=data[data.length-1];
  const projL=projPt?`<path d="M${X(ms(last.date)).toFixed(1)},${Y(last.v).toFixed(1)} L${X(projPt.t).toFixed(1)},${Y(projPt.v).toFixed(1)}" fill="none" stroke="var(--blue)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".6"/><circle cx="${X(projPt.t).toFixed(1)}" cy="${Y(projPt.v).toFixed(1)}" r="3.5" fill="#fff" stroke="var(--blue)" stroke-width="1.5"/>`:'';
  const refL=ref!=null?`<line x1="${px}" x2="${W-10}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="var(--green)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-10}" y="${Y(ref)-4}" text-anchor="end" font-size="11" fill="var(--green)">${ref}</text>`:'';
  const ticks=[y0+pad,y1-pad].map(v=>`<line x1="${px}" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${px-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink3)">${f(v)}</text>`).join('');
  const lbl=`<text x="${Math.min(X(ms(last.date)),W-24).toFixed(1)}" y="${(Y(last.v)-8).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${f(last.v)}</text>`;
  const xl=`<text x="${px}" y="${H-2}" font-size="10" fill="var(--ink3)">${fmtDate(data[0].date)}</text>`+(data.length>1||projPt?`<text x="${W-10}" y="${H-2}" text-anchor="end" font-size="10" fill="var(--ink3)">${projPt?'→ '+fmtDate(dstr(new Date(projPt.t))):fmtDate(last.date)}</text>`:'');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${ticks}${refL}${projL}<path d="${line}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>${dots}${lbl}${xl}</svg>`;
}

function renderBar(){
  const bar=$('#bar');
  const show = (S.view==='session' || S.view==='lift') && S.sel;
  if(!show){ bar.classList.add('hidden'); bar.innerHTML=''; return; }
  const ex=exById(S.sel.exId); if(!ex){ bar.classList.add('hidden'); return; }
  const editing=S.sel.setId?S.sets.find(s=>s.id===S.sel.setId):null;
  const date=S.view==='session'?S.date:todayStr();
  const n=setsOf(ex).filter(s=>s.done_on===date).length;
  const w = S.sel.w ?? (editing?+editing.weight:+ex.working_weight);
  const r = S.sel.r ?? (editing?editing.reps:ex.target_reps);
  const b=bestSet(ex, editing?null:undefined);
  const step=ex.kind==='bodyweight'?2.5:(+ex.increment||2.5);
  const wu=warmup(ex);
  bar.innerHTML=`<div class="in">
    <div class="top"><span>${esc(shortName(ex))} · ${editing?'edit set':'set '+(n+1)}${date!==todayStr()?' · '+fmtDate(date):''}</span><span>${b?'best '+fmtSet(ex,b):''}${!editing&&wu?' · warm-up '+wu:''}</span></div>
    <div class="big">${ex.kind==='bodyweight'?'<span>BW</span><span class="u">+</span>':''}<input id="bar-w" type="number" inputmode="decimal" value="${num(w)}"><span class="u">kg</span><span class="x">×</span><input id="bar-r" type="number" inputmode="numeric" value="${r}"><span class="u">${ex.name.includes('sec')?'sec':'reps'}</span></div>
    <div class="keys"><button data-k="w" data-d="-${step}">−${num(step)}</button><button data-k="w" data-d="${step}">+${num(step)}</button><button data-k="r" data-d="-1">−1</button><button data-k="r" data-d="1">+1</button>${editing?`<button class="del" data-act="delset" data-id="${editing.id}">Delete</button><button class="save" style="grid-column:span 1" data-act="savebar">Save</button>`:`<button class="save" data-act="savebar">Save</button>`}</div>
  </div>`;
  bar.classList.remove('hidden');
  bar.querySelectorAll('[data-k]').forEach(btn=>btn.onclick=()=>{ const inp=$('#bar-'+btn.dataset.k); const v=(+inp.value||0)+(+btn.dataset.d); inp.value=btn.dataset.k==='r'?Math.max(1,Math.round(v)):Math.max(0,Math.round(v*10)/10); S.sel[btn.dataset.k]=+inp.value; });
  $('#bar-w').oninput=e=>S.sel.w=+e.target.value; $('#bar-r').oninput=e=>S.sel.r=+e.target.value;
  bar.querySelectorAll('[data-act]').forEach(btn=>btn.onclick=()=>act(btn.dataset.act,btn));
}

/* ---------------- actions ---------------- */
function bind(){
  const app=$('#app');
  app.querySelectorAll('[data-act]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); act(b.dataset.act,b); });
  const sel=$('#add-ex'); if(sel) sel.onchange=()=>{ if(sel.value){ S.extra.add(sel.value); S.sel={exId:sel.value}; render(); } };
  ['#c-machine','#c-min','#c-cal'].forEach(id=>{ const el=$(id); if(el) el.onchange=()=>saveCardio(); });
}
async function guard(fn){ if(S.busy) return; S.busy=true; try{ await fn(); S.err=null; } catch(e){ console.error(e); S.err=friendly(e); } finally{ S.busy=false; render(); } }
function friendly(e){ const m=(e&&(e.message||String(e)))||'Unknown error'; if(/fetch|network|Failed to fetch|load failed/i.test(m)) return "Can't reach the database. If you've been away a while the Supabase project may have paused — open the Supabase dashboard, press Restore, then try again."; return m; }
function go(view,extra={}){ Object.assign(S,{view},extra); S.sel=null; S.tab = (view==='lifts'||view==='lift'||view==='body')?'lifts':'log'; window.scrollTo(0,0); render(); }
async function saveCardio(){
  const date=S.date; const m=$('#c-machine').value||null, minutes=+$('#c-min').value||null, calories=+$('#c-cal').value||null;
  const c=S.cardio.find(x=>x.done_on===date);
  try{
    if(c){ if(!m&&!minutes&&!calories){ await DB.remove('cardio',c.id); S.cardio=S.cardio.filter(x=>x.id!==c.id); } else Object.assign(c, await DB.update('cardio',c.id,{machine:m,minutes,calories})); }
    else if(m||minutes||calories){ S.cardio.push(await DB.insert('cardio',{done_on:date,machine:m,minutes,calories,distance:null})); }
    S.err=null;
  }catch(e){ S.err=friendly(e); render(); }
}
async function act(a,btn){
  const t=todayStr();
  if(a==='settings') return go('settings');
  if(a==='back') return go(S.view==='lift'||S.view==='body'?'lifts':'log');
  if(a==='open'){ S.extra=new Set(); return go('session',{date:btn.dataset.date, dayKey:btn.dataset.day||null}); }
  if(a==='lift') return go('lift',{liftId:btn.dataset.id});
  if(a==='body') return go('body');
  if(a==='toggleextras'){ S.showExtras=!S.showExtras; return render(); }
  if(a==='selex'){ S.sel={exId:btn.dataset.id}; return render(); }
  if(a==='selset'){ const s=S.sets.find(x=>x.id===btn.dataset.id); if(S.sel?.setId===s.id){ S.sel=null; } else S.sel={exId:s.exercise_id,setId:s.id}; return render(); }
  if(a==='savebar') return guard(async()=>{
    const ex=exById(S.sel.exId); const weight=+$('#bar-w').value||0, reps=+$('#bar-r').value||0;
    if(reps<=0) throw new Error('Reps must be at least 1');
    const date=S.view==='session'?S.date:t;
    if(S.sel.setId){ const s=S.sets.find(x=>x.id===S.sel.setId); Object.assign(s, await DB.update('sets',s.id,{weight,reps})); S.sel=null; }
    else { S.sets.push(await DB.insert('sets',{exercise_id:ex.id,done_on:date,weight,reps,is_test:false})); const n=setsOf(ex).filter(s=>s.done_on===date).length; S.sel = n<ex.target_sets ? {exId:ex.id} : null; }
  });
  if(a==='delset') return guard(async()=>{ await DB.remove('sets',btn.dataset.id); S.sets=S.sets.filter(s=>s.id!==btn.dataset.id); S.sel=null; });
  if(a==='deldate') return guard(async()=>{ if(!confirm('Delete everything logged on this day?')) return; const d=S.date; for(const s of S.sets.filter(s=>s.done_on===d)) await DB.remove('sets',s.id); for(const c of S.cardio.filter(c=>c.done_on===d)) await DB.remove('cardio',c.id); S.sets=S.sets.filter(s=>s.done_on!==d); S.cardio=S.cardio.filter(c=>c.done_on!==d); S.view='log'; S.sel=null; });
  if(a==='savebw') return guard(async()=>{ const kg=+$('#bw-kg').value; if(!kg) throw new Error('Enter your weight in kg'); S.bw.push(await DB.insert('bodyweight',{measured_on:t,kg})); S.bw.sort((a,b)=>a.measured_on<b.measured_on?-1:1); });
  if(a==='delbw') return guard(async()=>{ await DB.remove('bodyweight',btn.dataset.id); S.bw=S.bw.filter(b=>b.id!==btn.dataset.id); });
  if(a==='signout') return guard(async()=>{ await DB.signOut(); location.reload(); });
  if(a==='export') return exportCSV();
  if(a==='editex'){ if(S.view!=='settings'){ S.view='settings'; S.tab='log'; render(); } const e=btn.dataset.id?exById(btn.dataset.id):null; $('#exform').innerHTML=exForm(e); bind(); $('#exform-card').scrollIntoView({behavior:'smooth'}); return; }
  if(a==='cancelex'){ $('#exform').innerHTML=''; return; }
  if(a==='saveex') return guard(async()=>{
    const patch={name:$('#f-name').value.trim(),day:$('#f-day').value,kind:$('#f-kind').value,working_weight:+$('#f-ww').value||0,increment:+$('#f-inc').value||0,target_reps:+$('#f-reps').value||5,target_sets:+$('#f-sets').value||3,core:$('#f-core').checked};
    if(!patch.name) throw new Error('Name is required');
    if(btn.dataset.id){ patch.archived=$('#f-arch').checked; const ex=exById(btn.dataset.id); if(patch.working_weight!==+ex.working_weight) patch.ww_updated_on=t; Object.assign(ex, await DB.update('exercises',btn.dataset.id,patch)); }
    else { patch.sort_order=S.ex.length; patch.ww_updated_on=t; S.ex.push(await DB.insert('exercises',patch)); }
  });
  if(a==='seedex') return guard(async()=>{ await seedExercises(); });
  if(a==='import') return guard(async()=>{
    if(!confirm('Import your history? Do this once.')) return;
    const byKey=await seedExercises();
    const rows=SEED.sets.map(s=>({exercise_id:byKey[s.key].id,done_on:s.done_on,weight:s.weight,reps:s.reps,is_test:false}));
    for(let i=0;i<rows.length;i+=100) S.sets.push(...await DB.insertMany('sets',rows.slice(i,i+100)));
    S.cardio.push(...await DB.insertMany('cardio',SEED.cardio));
    S.bw.push(...await DB.insertMany('bodyweight',SEED.bodyweight));
    S.sets.sort((a,b)=>a.done_on<b.done_on?-1:1); S.view='log';
  });
}
async function seedExercises(){
  const byKey={}; const existing=new Map(S.ex.map(e=>[e.name,e]));
  for(const e of SEED.exercises){ if(existing.has(e.name)){ byKey[e.key]=existing.get(e.name); continue; } const {key,...row}=e; row.ww_updated_on=SEED.ww_updated_on; const r=await DB.insert('exercises',row); S.ex.push(r); byKey[key]=r; }
  return byKey;
}
function exportCSV(){
  const lines=['date,exercise,weight_kg,reps'];
  for(const s of S.sets){ const e=exById(s.exercise_id); lines.push(`${s.done_on},"${(e?.name||'').replace(/"/g,'""')}",${+s.weight},${s.reps}`); }
  lines.push('','date,cardio_machine,minutes,calories'); for(const c of S.cardio) lines.push(`${c.done_on},${c.machine||''},${c.minutes??''},${c.calories??''}`);
  lines.push('','date,bodyweight_kg'); for(const b of S.bw) lines.push(`${b.measured_on},${+b.kg}`);
  const blob=new Blob([lines.join('\n')],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`gym-${todayStr()}.csv`; a.click();
}

/* ---------------- auth + boot ---------------- */
function renderConfig(){
  $('#app').innerHTML=`<div class="auth"><h1>Connect database</h1><p class="small muted">Supabase → Project Settings → API.</p><label class="f">Project URL</label><input id="cfg-url" placeholder="https://xxxx.supabase.co"><label class="f">anon public key</label><input id="cfg-key" placeholder="eyJ…"><button class="primary" style="margin-top:14px;width:100%" id="cfg-save">Save</button></div>`;
  $('#cfg-save').onclick=()=>{ const u=$('#cfg-url').value.trim(), k=$('#cfg-key').value.trim(); if(!u||!k) return; localStorage.setItem('sb_url',u); localStorage.setItem('sb_key',k); location.reload(); };
}
function renderAuth(msg=''){
  $('#nav').classList.add('hidden'); $('#bar').classList.add('hidden');
  $('#app').innerHTML=`<div class="auth"><h1>Gym</h1>${msg?`<div class="note" style="margin:0 0 10px">${esc(msg)}</div>`:''}<label class="f">Email</label><input id="a-email" type="email" autocomplete="email" inputmode="email"><label class="f">Password</label><input id="a-pw" type="password" autocomplete="current-password"><div class="rowbtn"><button class="primary" style="flex:1" id="a-in">Sign in</button><button id="a-up">Create account</button></div></div>`;
  const go=async(up)=>{ try{ const email=$('#a-email').value.trim(), password=$('#a-pw').value;
      if(up){ const r=await DB.signUp(email,password); if(!r.session) return renderAuth('Account created. If your project requires email confirmation, check your inbox, then sign in.'); }
      else await DB.signIn(email,password);
      boot(); }catch(e){ renderAuth(friendly(e)); } };
  $('#a-in').onclick=()=>go(false); $('#a-up').onclick=()=>go(true); $('#a-pw').onkeydown=e=>{ if(e.key==='Enter') go(false); };
}
async function boot(){
  const sess=await DB.session(); if(!sess) return renderAuth(); S.user=sess.user;
  try{ const d=await DB.loadAll(); S.ex=d.exercises; S.sets=d.sets; S.cardio=d.cardio; S.bw=d.bodyweight; await applyProgression(); if(!S.ex.length) S.view='settings'; }
  catch(e){ S.err=friendly(e); }
  render();
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
(function init(){
  if(MOCK){ DB=makeMockDB(); return boot(); }
  const url=SUPABASE_URL||localStorage.getItem('sb_url'), key=SUPABASE_ANON_KEY||localStorage.getItem('sb_key');
  if(!url||!key) return renderConfig();
  if(!window.supabase){ $('#app').innerHTML='<div class="banner">Could not load the database library. Check your connection and reload.</div>'; return; }
  DB=makeSupabaseDB(url,key); boot();
})();
</script>
